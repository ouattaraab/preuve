# Analyse stricte : ce paquet porte les règles métier du client, et une erreur
# de type y coûte plus cher qu'ailleurs — elle voyage jusque sur le téléphone
# d'un acheteur au marché.
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    todo: ignore

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - unnecessary_lambdas
