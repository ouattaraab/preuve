name: preuve_app
description: >-
  PREUVE — vérifier un bien avant d'acheter. Registre déclaratif de propriété
  et de statut des biens, Côte d'Ivoire.
publish_to: none

# La version est lue par le serveur (`X-App-Version`) pour appliquer, le cas
# échéant, une version minimale exigée. Elle doit donc suivre la réalité des
# livraisons, pas rester à 1.0.0.
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Le cœur métier, en Dart pur : il s'analyse et se teste sans appareil.
  preuve_core:
    path: ../preuve_core
  # Trousseau iOS et Keystore Android. LA SEULE DÉPENDANCE TIERCE DE
  # L'APPLICATION, et elle se justifie : écrire soi-même le pont vers ces
  # coffres serait plus risqué que de dépendre d'un paquet éprouvé. Le jeton de
  # session ouvre l'accès aux biens d'une personne — il n'a rien à faire dans un
  # fichier de préférences en clair.
  flutter_secure_storage: ^9.2.2
  # Appareil photo et galerie. SECONDE ET DERNIÈRE EXCEPTION au principe « aucune
  # dépendance externe » (décision d'Aboubakar, 04/08/2026), justifiée comme la
  # première : écrire soi-même le pont vers la caméra et la photothèque de deux
  # plateformes serait plus risqué que d'en dépendre. Sans elle, aucun bien ne
  # peut dépasser « Déclaré » — ni justificatif, ni KYC, ni pièce de réclamation,
  # donc aucune réclamation jamais gagnée sur la grille d'arbitrage.
  # Greffon maintenu par l'équipe Flutter elle-même (flutter/packages).
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Pilote l'application RÉELLE sur un appareil : c'est le seul harnais qui
  # exerce les greffons natifs — trousseau, appareil photo. Livré avec le SDK,
  # ce n'est donc pas une dépendance tierce de plus.
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Les deux polices de la maquette DJASSA.
  #
  # BRICOLAGE GROTESQUE EST INSTANCIÉE EN GRAISSES FIXES, à partir de la police
  # variable officielle : Flutter n'applique les axes d'une variable que si on
  # les lui nomme un à un (`fontVariations`), ce qui obligerait chaque style du
  # thème à les répéter. Deux fichiers statiques rendent exactement la même
  # chose, et un titre mal graissé ne peut plus passer inaperçu.
  #
  # ATKINSON HYPERLEGIBLE n'est pas un choix d'esthétique : elle est dessinée
  # par le Braille Institute pour distinguer les caractères qui se confondent —
  # le 0 et le O, le 1 et le I. C'est exactement ce qu'on lit ici : des numéros
  # de châssis de dix-sept caractères, debout, en plein soleil.
  fonts:
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: Atkinson
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
          weight: 400
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
