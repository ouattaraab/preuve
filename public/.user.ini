; Bornes d'envoi, appliquées par PHP AVANT que l'application ne voie la requête.
;
; POURQUOI CE FICHIER. L'hébergement accepte par défaut 1536 Mo par requête,
; alors que PREUVE valide chaque pièce à 8 Mo. Or la validation de Laravel
; s'exécute APRÈS que PHP a intégralement bufferisé l'envoi sur disque : un
; visiteur SANS COMPTE pouvait donc faire écrire un giga-octet et demi au
; serveur avant d'être refusé, dix fois par dix minutes, sur `/lookup/scan`.
; Sur un mutualisé dont le quota disque coupe aussi l'écriture du registre,
; c'est un déni de service à coût nul pour l'attaquant.
;
; post_max_size tient compte du dossier d'identité, qui part d'un seul tenant :
; recto, verso, selfie et deux prises de vivacité, soit cinq fichiers.
upload_max_filesize = 10M
post_max_size = 56M
max_file_uploads = 8
